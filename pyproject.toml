[project]
name = "clickhouse-timeseries-ai"
version = "0.1.0"
description = "Time Series Foundation Model forecasting and anomaly detection with ClickHouse"
requires-python = ">=3.11,<3.14"
dependencies = [
  "timesfm[torch]==3.0.2",
  "timestral @ https://github.com/mistralai/timestral/archive/a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff.tar.gz",
  "torch==2.14.1",
  "fastapi==0.163.1",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
