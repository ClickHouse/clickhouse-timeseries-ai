name: clickhouse-timeseries-ai

services:
  model:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["--model", "${TIMESERIES_MODEL:-timesfm-3.0}"]
    environment:
      TIMESERIES_API_KEY: ${TIMESERIES_API_KEY:-local-evaluation-only}
      TIMESFM_REVISION: ${TIMESFM_REVISION:-43046b85ec22d584a13f8098c2ed39c889e129c2}
      TIMESFM_DEVICE: cpu
      TIMESTRAL_REVISION: ${TIMESTRAL_REVISION:-9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
      TIMESTRAL_DEVICE: cpu
      TIMESERIES_MODEL: ${TIMESERIES_MODEL:-timesfm-3.0}
      TIMESERIES_HOST: 0.0.0.0
      HF_HOME: /cache/huggingface
    ports:
      - "127.0.0.1:${MODEL_PORT:-8091}:8091"
    volumes:
      - model-cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 15m
      retries: 12

  clickhouse:
    build:
      context: .
      dockerfile: clickhouse/Dockerfile
    depends_on:
      model:
        condition: service_healthy
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      TIMESERIES_URL: http://model:8091
      TIMESERIES_MODEL: ${TIMESERIES_MODEL:-timesfm-3.0}
      TIMESERIES_API_KEY: ${TIMESERIES_API_KEY:-local-evaluation-only}
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-8125}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  model-cache:
  clickhouse-data:
